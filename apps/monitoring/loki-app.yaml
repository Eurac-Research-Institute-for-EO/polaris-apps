apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: loki
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
spec:
    project: polaris
    source:
        chart: loki
        repoURL: https://grafana.github.io/helm-charts
        # https://github.com/grafana/helm-charts/releases?q=loki
        # Aligned with EOEPCA reference (https://github.com/EOEPCA/eoepca-plus)
        targetRevision: 6.55.0
        helm:
            releaseName: loki
            values: |
                # SingleBinary mode: one pod, suitable for small/dev clusters.
                deploymentMode: SingleBinary

                loki:
                  auth_enabled: false
                  commonConfig:
                    replication_factor: 1

                  # schemaConfig is required in loki chart >= 6.x
                  schemaConfig:
                    configs:
                      - from: "2024-01-01"
                        store: tsdb
                        object_store: filesystem
                        schema: v13
                        index:
                          prefix: loki_index_
                          period: 24h

                  storage:
                    type: filesystem

                  limits_config:
                    retention_period: 168h
                    # Guardrails: filesystem Loki has NO size-based eviction
                    # (retention is time-only), so these stop a single noisy
                    # namespace from filling the 10Gi PVC before retention kicks in.
                    ingestion_rate_mb: 8
                    ingestion_burst_size_mb: 16
                    per_stream_rate_limit: 4MB
                    per_stream_rate_limit_burst: 8MB
                    max_label_names_per_series: 30
                    reject_old_samples: true
                    reject_old_samples_max_age: 168h
                    # Don't allow queries to look back further than we retain.
                    max_query_lookback: 168h

                  compactor:
                    retention_enabled: true
                    # delete_request_store is required when retention_enabled=true;
                    # must match the object_store in schemaConfig
                    delete_request_store: filesystem
                    retention_delete_delay: 2h
                    compaction_interval: 10m

                singleBinary:
                  replicas: 1
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 512Mi
                  persistence:
                    enabled: true
                    size: 10Gi

                # Disable all distributed-mode components
                read:
                  replicas: 0
                write:
                  replicas: 0
                backend:
                  replicas: 0

                # Disable in-memory caches (no memcached in this setup)
                chunksCache:
                  enabled: false
                resultsCache:
                  enabled: false

                # Disable bundled gateway, test, and canary components
                gateway:
                  enabled: false
                test:
                  enabled: false
                lokiCanary:
                  enabled: false

                # Wire up a ServiceMonitor so kube-prometheus-stack can scrape Loki
                monitoring:
                  serviceMonitor:
                    enabled: true
                    additionalLabels:
                      release: monitoring

    destination:
        server: https://kubernetes.default.svc
        namespace: monitoring

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
