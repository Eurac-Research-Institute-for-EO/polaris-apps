apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: dask-gateway
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
spec:
    project: polaris
    source:
        chart: dask-gateway
        repoURL: https://helm.dask.org
        # https://github.com/dask/dask-gateway/releases (calver YYYY.M.PATCH)
        targetRevision: 2026.3.0
        helm:
            releaseName: dask-gateway
            # Don't manage the bundled Traefik's CRDs. k3s's built-in Traefik
            # already installs ingressroutes.traefik.io et al. (generated with a
            # newer controller-gen), so letting this app also apply the chart's
            # older copy makes the two ping-pong the CRD forever -> permanent
            # OutOfSync. skipCrds leaves CRD ownership to k3s Traefik.
            skipCrds: true
            values: |
                # -- DEMO setup ------------------------------------------------
                # Internal-only Dask Gateway for colleagues on the local network.
                # No access control (intentional - see gateway.auth below).
                # Connect from a client:
                #   from dask_gateway import Gateway
                #   g = Gateway("http://10.8.244.185:30080")
                #   cluster = g.new_cluster(); cluster.scale(2)
                #   client = cluster.get_client()

                gateway:
                  # No access control: simple auth with an empty password accepts
                  # any user, which is what we want for an internal demo. Tighten
                  # this (jupyterhub/custom auth) before any non-local exposure.
                  auth:
                    type: simple
                    simple:
                      password:

                  # Any compute node, never the control plane. Anchored here and
                  # reused by the controller, traefik and the dynamically created
                  # scheduler/worker pods below, so the rule is defined once.
                  affinity: &computeNodes
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: node-role.kubernetes.io/control-plane
                                operator: DoesNotExist

                  backend:
                    # The scheduler/worker pods are created dynamically by the
                    # controller, so their placement is set via extraPodConfig
                    # (a partial pod spec) rather than a plain nodeSelector key.
                    scheduler:
                      extraPodConfig:
                        affinity: *computeNodes
                    worker:
                      extraPodConfig:
                        affinity: *computeNodes
                        # Spread workers across nodes instead of packing them
                        # onto whichever node the scheduler likes first.
                        #
                        # whenUnsatisfiable MUST stay ScheduleAnyway. With
                        # DoNotSchedule this becomes a hard cap: once the skew
                        # limit is hit, further workers sit Pending forever and
                        # adaptive scaling silently stops working — which looks
                        # exactly like a broken controller. Soft spreading gets
                        # the balance without ever blocking a scale-up.
                        topologySpreadConstraints:
                          - maxSkew: 1
                            topologyKey: kubernetes.io/hostname
                            whenUnsatisfiable: ScheduleAnyway
                            labelSelector:
                              matchLabels:
                                app.kubernetes.io/component: dask-worker

                  # extraConfig is a top-level gateway key (sibling of auth/backend),
                  # not nested under backend.
                  extraConfig:
                    # The key name here doesn't matter. Values in the `extraConfig`
                    # map are concatenated, sorted by key name.
                    clusteroptions: |
                      from dask_gateway_server.options import Options, Integer, Float, String

                      def option_handler(options):
                          return {
                              "worker_cores": options.worker_cores,
                              "worker_memory": "%fG" % options.worker_memory,
                              "image": options.image,
                          }

                      c.Backend.cluster_options = Options(
                          # Max 8 cores = a quarter of one node. A worker must fit
                          # entirely on a single node, so this is also the largest
                          # single unit of work the cluster can ever place.
                          Integer("worker_cores", 2, min=1, max=8, label="Worker Cores"),
                          Float("worker_memory", 16, min=1, max=64, label="Worker Memory (GiB)"),
                          String("image", default="ghcr.io/dask/dask-gateway:2026.3.0", label="Image"),
                          handler=option_handler,
                      )

                      # CAPS. Without these, one `cluster.scale(500)` from anyone
                      # on the LAN takes both compute nodes, including the one
                      # running openeo STABLE. There is no authentication here
                      # (see gateway.auth), so this is the only thing standing
                      # between a mistyped number and everyone else's jobs.
                      #
                      # These do NOT stop a node dying — Kubernetes already does
                      # that. dask-gateway sets memory requests == limits, so a
                      # worker that overruns is OOMKilled on its own rather than
                      # taking the kubelet with it, and work that cannot be placed
                      # sits Pending rather than evicting openeo. What these caps
                      # prevent is MONOPOLISATION.
                      #
                      # ~37% of the pool per cluster, so two people can work at
                      # once and still leave ~14 cores / ~115 GiB for openeo. A
                      # third concurrent full-size cluster is not rejected — its
                      # pods just stay Pending until capacity frees up.
                      #
                      # 24 cores x 8 GiB/core = 192 GiB keeps the cluster cap on
                      # the same ratio as the workers. Note the scheduler pod
                      # counts against these: max workers is computed as
                      # (cluster_max_cores - scheduler_cores) // worker_cores.
                      #
                      # LIMITATION: per-cluster is the ONLY granularity this
                      # version offers. `UserLimits` existed in dask-gateway
                      # 0.9.x but is gone in 2026.3.0, and the upstream docs
                      # (gateway.dask.org/resource-limits.html) list only these
                      # three. So one person opening three clusters can still
                      # oversubscribe the pool; idle_timeout below is the
                      # backstop, not a real per-user quota.
                      c.ClusterConfig.cluster_max_cores = 24
                      c.ClusterConfig.cluster_max_memory = "192 G"
                      c.ClusterConfig.cluster_max_workers = 24

                      # Reclaim abandoned clusters. The default is 0 = never, so
                      # a colleague who closes their laptop without calling
                      # shutdown() holds their cores until someone notices by
                      # hand. This is the most likely way the pool silently fills
                      # up. An hour is long enough to survive a coffee break; a
                      # cluster actively running a graph is not idle and is never
                      # touched by this.
                      c.ClusterConfig.idle_timeout = 3600

                # The chart's bundled Traefik is the proxy clients connect to. It
                # demultiplexes the HTTP API from the TLS scheduler stream itself,
                # so we only need to expose its single web port.
                traefik:
                  # Free to run on either compute node: a NodePort is opened on
                  # EVERY node and kube-proxy forwards to wherever the pod lives,
                  # so clients keep using the same host:port regardless.
                  affinity: *computeNodes
                  service:
                    type: NodePort
                    ports:
                      web:
                        port: 80
                        nodePort: 30080
                      tcp:
                        # Share the web port: scheduler TCP rides the same nodePort.
                        port: web

                controller:
                  affinity: *computeNodes

    destination:
        server: https://kubernetes.default.svc
        namespace: dask-gateway

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
