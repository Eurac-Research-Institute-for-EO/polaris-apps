apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: dask-gateway
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
spec:
    project: polaris
    source:
        chart: dask-gateway
        repoURL: https://helm.dask.org
        # https://github.com/dask/dask-gateway/releases (calver YYYY.M.PATCH)
        targetRevision: 2026.3.0
        helm:
            releaseName: dask-gateway
            values: |
                # -- DEMO setup ------------------------------------------------
                # Internal-only Dask Gateway for colleagues on the local network.
                # No access control (intentional - see gateway.auth below).
                #
                # Exposure: NodePort, so it works TODAY without MetalLB / a free
                # LAN IP / IT involvement. Dask multiplexes the HTTP API AND the
                # raw scheduler/compute traffic over a SINGLE port, and NodePort
                # is plain L4 forwarding, so one nodePort carries everything.
                #
                # Connect from a client:
                #   from dask_gateway import Gateway
                #   g = Gateway("http://10.8.244.185:30080")
                #   cluster = g.new_cluster(); cluster.scale(2)
                #   client = cluster.get_client()
                #
                # Placement: all pods (gateway, traefik, controller AND the
                # dynamically created scheduler/worker pods) are pinned to the
                # dev node 10.8.244.185 via nodeSelector polaris.eurac.edu/env=dev
                # - the same node/label the openeo-dev workloads use, chosen here
                # because it has more resources. Requires the node be labelled:
                #   kubectl label node <dev-node> polaris.eurac.edu/env=dev
                #
                # UPGRADE PATH (when IT is back -> proper LoadBalancer setup):
                #   1. Deploy MetalLB (L2) with a reserved LAN IP pool.
                #   2. Change traefik.service.type below to LoadBalancer and drop
                #      the nodePort line; the gateway then gets a dedicated IP.
                # --------------------------------------------------------------

                gateway:
                  # No access control: simple auth with an empty password accepts
                  # any user, which is what we want for an internal demo. Tighten
                  # this (jupyterhub/custom auth) before any non-local exposure.
                  auth:
                    type: simple
                    simple:
                      password:

                  # Pin the API server pod to the dev node.
                  nodeSelector:
                    polaris.eurac.edu/env: dev

                  backend:
                    # The scheduler/worker pods are created dynamically by the
                    # controller, so their placement is set via extraPodConfig
                    # (a partial pod spec) rather than a plain nodeSelector key.
                    scheduler:
                      extraPodConfig:
                        nodeSelector:
                          polaris.eurac.edu/env: dev
                    worker:
                      extraPodConfig:
                        nodeSelector:
                          polaris.eurac.edu/env: dev

                    gateway:
                      extraConfig:
                        # Note that the key name here doesn't matter. Values in the
                        # `extraConfig` map are concatenated, sorted by key name.
                        clusteroptions: |
                            from dask_gateway_server.options import Options, Integer, Float, String

                            def option_handler(options):
                                return {
                                    "worker_cores": options.worker_cores,
                                    "worker_memory": "%fG" % options.worker_memory,
                                    "image": options.image,
                                }

                            c.Backend.cluster_options = Options(
                                Integer("worker_cores", 4, min=1, max=8, label="Worker Cores"),
                                Float("worker_memory", 4, min=1, max=16, label="Worker Memory (GiB)"),
                                String("image", default="daskgateway/dask-gateway:latest", label="Image"),
                                handler=option_handler,
                            )

                # The chart's bundled Traefik is the proxy clients connect to. It
                # demultiplexes the HTTP API from the TLS scheduler stream itself,
                # so we only need to expose its single web port.
                traefik:
                  nodeSelector:
                    polaris.eurac.edu/env: dev
                  service:
                    type: NodePort
                    ports:
                      web:
                        port: 80
                        nodePort: 30080
                      tcp:
                        # Share the web port: scheduler TCP rides the same nodePort.
                        port: web

                controller:
                  nodeSelector:
                    polaris.eurac.edu/env: dev

    destination:
        server: https://kubernetes.default.svc
        namespace: dask-gateway

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
