apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-nginx

commonLabels:
  app.kubernetes.io/name: hello-nginx
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

replicas:
  - name: hello-nginx
    count: 2
