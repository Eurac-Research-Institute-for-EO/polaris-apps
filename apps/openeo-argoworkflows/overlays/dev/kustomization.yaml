apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev openeo: node 10.8.244.185, namespace "openeo-dev".
# Public via the ICT reverse proxy at dev.openeo.eurac.edu (proxy terminates
# TLS; in-cluster ingress stays plain HTTP). Assumes the proxy preserves the
# Host header and forwards to .185's Traefik web entrypoint — confirm with ICT.
#
# Helm VALUES (api dns/tls, node, sizing, image, …) live in ../../values/*.yaml,
# not here. These patches only set Application-OBJECT fields (name, namespace,
# releaseName, which valueFiles to load, Image Updater annotations) and the
# Ingress — none of which are Helm values.
resources:
    - namespace.yaml
    - ../../base

patches:
    - target:
          kind: Application
          name: openeo-argoworkflows
      patch: |-
          - op: replace
            path: /metadata/name
            value: openeo-argoworkflows-dev
          # ArgoCD Image Updater opt-in (dev only). `digest` strategy tracks the
          # mutable :dev tag and fires whenever a new image is pushed to it,
          # git-writing image.tag (as dev@sha256:<digest>) into image-dev.yaml on
          # the polaris-apps `dev` branch. Switch update-strategy to `semver` once
          # the CI publishes immutable vX.Y.Z tags. See the app README.
          - op: add
            path: /metadata/annotations
            value:
                argocd-image-updater.argoproj.io/image-list: "api=ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-api:dev"
                argocd-image-updater.argoproj.io/api.update-strategy: "digest"
                argocd-image-updater.argoproj.io/api.helm.image-name: "image.repository"
                argocd-image-updater.argoproj.io/api.helm.image-tag: "image.tag"
                argocd-image-updater.argoproj.io/write-back-method: "git:secret:argocd/polaris-apps-image-updater"
                argocd-image-updater.argoproj.io/git-repository: "git@github.com:Eurac-Research-Institute-for-EO/polaris-apps.git"
                argocd-image-updater.argoproj.io/git-branch: "dev"
                argocd-image-updater.argoproj.io/write-back-target: "helmvalues:/apps/openeo-argoworkflows/values/image-dev.yaml"
          - op: replace
            path: /spec/destination/namespace
            value: openeo-dev
          # Distinct release name so chart-generated names (incl. cluster-scoped
          # ClusterRoles like *-dask-gateway) don't collide with stable.
          - op: replace
            path: /spec/sources/0/helm/releaseName
            value: openeo-dev
          # Load the dev value files (over base). image-dev.yaml is last so it
          # wins, and is the file Image Updater writes image.tag into.
          - op: replace
            path: /spec/sources/0/helm/valueFiles
            value:
                - $values/apps/openeo-argoworkflows/values/base.yaml
                - $values/apps/openeo-argoworkflows/values/dev.yaml
                - $values/apps/openeo-argoworkflows/values/image-dev.yaml

    - target:
          kind: Ingress
          name: openeo-argoworkflows
      patch: |-
          - op: replace
            path: /metadata/namespace
            value: openeo-dev
          # No host patch: the base rule is host-less, so dev is reachable by
          # node IP (http://10.8.244.185/openeo/...) without DNS or a proxy.
          # Service name follows the dev releaseName (openeo-dev-openeo-argo).
          # Patch every path's backend (paths[0]=/openeo, paths[1]=/.well-known/openeo).
          - op: replace
            path: /spec/rules/0/http/paths/0/backend/service/name
            value: openeo-dev-openeo-argo
          - op: replace
            path: /spec/rules/0/http/paths/1/backend/service/name
            value: openeo-dev-openeo-argo
