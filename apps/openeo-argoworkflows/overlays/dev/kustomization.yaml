apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev openeo: node 10.8.244.185, namespace "openeo-dev".
# Public via the ICT reverse proxy at dev.openeo.eurac.edu (proxy terminates
# TLS; in-cluster ingress stays plain HTTP). Assumes the proxy preserves the
# Host header and forwards to .185's Traefik web entrypoint — confirm with ICT.
resources:
    - namespace.yaml
    - ../../base

patches:
    - target:
          kind: Application
          name: openeo-argoworkflows
      patch: |-
          - op: replace
            path: /metadata/name
            value: openeo-argoworkflows-dev
          - op: replace
            path: /spec/destination/namespace
            value: openeo-dev
          # Distinct release name so chart-generated names (incl. cluster-scoped
          # ClusterRoles like *-dask-gateway) don't collide with stable.
          - op: replace
            path: /spec/source/helm/releaseName
            value: openeo-dev
          # Postgres secret follows the dev releaseName: the chart reads
          # <release>-postgresql, so point existingSecret at openeo-dev-postgresql
          # (created by ansible in the openeo-dev namespace). Base default is the
          # stable name (openeo-postgresql).
          - op: replace
            path: /spec/source/helm/valuesObject/postgresql/auth/existingSecret
            value: openeo-dev-postgresql
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/apiDns
            value: 10.8.244.185 # Replace with dev.openeo.eurac.edu
          # false for plain-HTTP IP access: the API advertises its links as
          # {scheme}://{apiDns}/openeo/1.1.0/, so http here -> http links that
          # work on :80. Set back to true when serving via the HTTPS proxy.
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/apiTLS
            value: false
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/apiUrl
            value: http://10.8.244.185/openeo/1.1.0
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/apiTitle
            value: "OpenEO ArgoWorkflows (Dev)"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/apiDescription
            value: "Development deployment of the openEO API for Argo Workflows at EURAC."
          # Pin the workload to the internal/dev node.
          # Requires: kubectl label node <dev-node> polaris.eurac.edu/env=dev
          - op: replace
            path: /spec/source/helm/valuesObject/nodeSelector
            value:
                polaris.eurac.edu/env: dev
          # Image pins (per-env so stable/dev can diverge later).
          # Bump these to test a different build on dev without touching stable.
          - op: replace
            path: /spec/source/helm/valuesObject/image/tag
            value: "dev"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/executorImage
            value: "ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-executor:dev"
          # Sizing (per-env so stable/dev can diverge). Dask cluster sizing per
          # job and API-pod resources/scaling.
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerCores
            value: "4"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerMemory
            value: "32"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerLimit
            value: "4"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskClusterTimeout
            value: "3600"
          # replicaCount = number of API server pods (Deployment replicas).
          - op: replace
            path: /spec/source/helm/valuesObject/replicaCount
            value: 1
          - op: replace
            path: /spec/source/helm/valuesObject/resources
            value:
                limits:
                    cpu: 500m
                    memory: 512Mi
                requests:
                    cpu: 250m
                    memory: 256Mi
          - op: replace
            path: /spec/source/helm/valuesObject/autoscaling
            value:
                enabled: false
          # Enable S3 output upload. Renders the S3_* env block (chart
          # deployment.yaml), sourced from secret "openeo-s3-credentials"
          # (keys: endpoint_url, bucket, access_key, secret_key) which must
          # exist in the openeo-dev namespace (copied from prod, not committed).
          - op: add
            path: /spec/source/helm/valuesObject/s3
            value:
                enabled: true

    - target:
          kind: Ingress
          name: openeo-argoworkflows
      patch: |-
          - op: replace
            path: /metadata/namespace
            value: openeo-dev
          # No host patch: the base rule is host-less, so dev is reachable by
          # node IP (http://10.8.244.185/openeo/...) without DNS or a proxy.
          # Service name follows the dev releaseName (openeo-dev-openeo-argo).
          # Patch every path's backend (paths[0]=/openeo, paths[1]=/.well-known/openeo).
          - op: replace
            path: /spec/rules/0/http/paths/0/backend/service/name
            value: openeo-dev-openeo-argo
          - op: replace
            path: /spec/rules/0/http/paths/1/backend/service/name
            value: openeo-dev-openeo-argo
