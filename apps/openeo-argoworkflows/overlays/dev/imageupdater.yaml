# ArgoCD Image Updater config for the dev openeo app.
#
# Image Updater v1.2.2 (chart 1.2.4) is a controller-runtime controller that ONLY
# reconciles `ImageUpdater` custom resources — it no longer reads the old
# `argocd-image-updater.argoproj.io/*` annotations on the Application. So tracking
# is expressed here, as a CR, instead of as annotations in kustomization.yaml.
#
# This replaces those annotations 1:1. It targets the dev Application by name and
# git-writes new image references into values/image-dev.yaml on the polaris-apps
# `dev` branch (see that file's header) — ArgoCD then re-syncs. Write-back to git
# (not a live patch) is deliberate: the app-of-apps runs selfHeal, so git must be
# the source of truth or the parent would revert a live patch as drift.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
    name: openeo-argoworkflows-dev
    namespace: argocd
spec:
    applicationRefs:
        - namePattern: openeo-argoworkflows-dev
          images:
              # api: split repository + tag. `digest` tracks the mutable :dev tag
              # and fires on every new push to it, writing image.tag as
              # dev@sha256:<digest>. Switch to `semver` once CI publishes vX.Y.Z.
              - alias: api
                imageName: ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-api:dev
                commonUpdateSettings:
                    updateStrategy: digest
                manifestTargets:
                    helm:
                        name: image.repository
                        tag: image.tag
              # executor: single repo:tag string in one value (helm `spec`, the old
              # helm.image-spec). forceUpdate because the executor never runs as a
              # container in this pod tree (it launches in dynamically-created Argo
              # workflow pods), so Image Updater can't discover a "current" image to
              # diff — it updates from the configured value instead.
              - alias: executor
                imageName: ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-executor:dev
                commonUpdateSettings:
                    updateStrategy: digest
                    forceUpdate: true
                manifestTargets:
                    helm:
                        spec: global.env.executorImage
    # git write-back over the SSH deploy key in Secret argocd/polaris-apps-image-updater
    # (created by multinode/tasks/master/secrets.yaml from image_updater_git_ssh_key).
    writeBackConfig:
        method: "git:secret:argocd/polaris-apps-image-updater"
        gitConfig:
            repository: "git@github.com:Eurac-Research-Institute-for-EO/polaris-apps.git"
            branch: dev
            writeBackTarget: "helmvalues:/apps/openeo-argoworkflows/values/image-dev.yaml"
