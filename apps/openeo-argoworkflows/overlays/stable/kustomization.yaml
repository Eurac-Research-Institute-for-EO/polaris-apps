apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stable openeo: public node, namespace "openeo", host on the public node IP.
# Keeps the Application name "openeo" so the existing deployment is updated
# in place (only nodeSelector is added vs. what is already running).
resources:
    - namespace.yaml
    - ../../base

patches:
    # Pin the workload to the public/stable node.
    # Requires: kubectl label node <stable-node> polaris.eurac.edu/env=stable
    - target:
          kind: Application
          name: openeo-argoworkflows
      patch: |-
          - op: replace
            path: /spec/source/helm/valuesObject/nodeSelector
            value:
                polaris.eurac.edu/env: stable
          # Image pins (per-env so stable/dev can diverge later).
          - op: replace
            path: /spec/source/helm/valuesObject/image/tag
            value: "latest"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/executorImage
            value: "ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-executor:latest"
          # Sizing (per-env so stable/dev can diverge). Dask cluster sizing per
          # job and API-pod resources/scaling.
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerCores
            value: "4"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerMemory
            value: "8"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskWorkerLimit
            value: "6"
          - op: replace
            path: /spec/source/helm/valuesObject/global/env/daskClusterTimeout
            value: "3600"
          # replicaCount = number of API server pods (Deployment replicas).
          - op: replace
            path: /spec/source/helm/valuesObject/replicaCount
            value: 1
          - op: replace
            path: /spec/source/helm/valuesObject/resources
            value:
                limits:
                    cpu: 500m
                    memory: 512Mi
                requests:
                    cpu: 250m
                    memory: 256Mi
          - op: replace
            path: /spec/source/helm/valuesObject/autoscaling
            value:
                enabled: false

    # Give stable a real public hostname so it doesn't collide with dev's
    # host-less rule on the shared Traefik (host rules win over host-less ones).
    - target:
          kind: Ingress
          name: openeo-argoworkflows
      patch: |-
          - op: add
            path: /spec/rules/0/host
            value: openeo.eurac.edu
