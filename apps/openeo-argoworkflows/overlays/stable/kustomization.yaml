apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stable openeo: public node, namespace "openeo", host on the public node IP.
# Keeps the base Application name/namespace/releaseName (openeo), so only the
# value files and the public hostname differ from base.
#
# Helm VALUES live in ../../values/*.yaml; these patches only set the valueFiles
# to load and the Ingress host. Image Updater is NOT enabled for stable yet — to
# turn it on, copy the dev overlay's annotations and point write-back-target at
# values/image-stable.yaml.
resources:
    - namespace.yaml
    - ../../base

patches:
    - target:
          kind: Application
          name: openeo-argoworkflows
      patch: |-
          # Load the stable value files (over base). image-stable.yaml last.
          - op: replace
            path: /spec/sources/0/helm/valueFiles
            value:
                - $values/apps/openeo-argoworkflows/values/base.yaml
                - $values/apps/openeo-argoworkflows/values/stable.yaml
                - $values/apps/openeo-argoworkflows/values/image-stable.yaml

    # Give stable a real public hostname so it doesn't collide with dev's
    # host-less rule on the shared Traefik (host rules win over host-less ones).
    - target:
          kind: Ingress
          name: openeo-argoworkflows
      patch: |-
          - op: add
            path: /spec/rules/0/host
            value: openeo.eurac.edu
