apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Env-neutral base for openeo-argoworkflows.
# Placement (node), namespace, and public host are applied per environment
# in overlays/stable and overlays/dev. Do not reference this base directly
# from apps/kustomization.yaml — reference the overlays instead.
resources:
    - helm-openeo-argoworkflows.yaml
    - ingress-openeo.yaml
