apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: openeo-argoworkflows
    namespace: argocd
spec:
    project: polaris
    source:
        repoURL: https://github.com/Eurac-Research-Institute-for-EO/charts
        targetRevision: openeo-fix
        path: eodc/openeo-argo
        helm:
            releaseName: openeo
            valuesObject:
                global:
                    env:
                        alembicDir: "/opt/openeo_argoworkflows_api/psql"
                        apiDns: openeo.eurac.edu
                        apiTLS: true
                        apiUrl: "https://openeo.eurac.edu/openeo/1.1.0"
                        apiTitle: "OpenEO ArgoWorkflows"
                        apiDescription: "A K8S deployment of the openeo api for argoworkflows."
                        oidcUrl: "https://edp-portal.eurac.edu/auth/realms/edp"
                        oidcOrganisation: "eurac" # eurac-keycloak if it breaks
                        oidcProviderTitle: "EURAC Keycloak"
                        oidcPolicies: ""
                        stacCatalogueUrl: "https://stac.eurac.edu/"
                        workspaceRoot: "/user_workspaces"
                        executorImage: "ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-executor:latest"
                        daskWorkerCores: "4"
                        daskWorkerMemory: "8"
                        daskWorkerLimit: "6"
                        daskClusterTimeout: "3600"

                replicaCount: 1

                image:
                    repository: ghcr.io/eurac-research-institute-for-eo/openeo-argoworkflows-api
                    pullPolicy: Always
                    tag: "latest"

                postgresql:
                    enabled: true
                    image:
                        repository: bitnamilegacy/postgresql
                    auth:
                        username: "postgres"
                        database: "postgres"
                        # Password is sourced from the per-release Secret created by
                        # ansible (multinode/tasks/master/secrets.yaml) BEFORE argocd
                        # syncs — never commit plaintext here. Default name below is
                        # for the stable release (release "openeo" -> openeo-postgresql);
                        # the dev overlay patches it to openeo-dev-postgresql.
                        # The Bitnami subchart AND the openeo API/cronjobs both read
                        # the key postgres-password from this same secret.
                        existingSecret: openeo-postgresql
                        secretKeys:
                            adminPasswordKey: postgres-password
                            userPasswordKey: postgres-password
                            replicationPasswordKey: postgres-password
                    persistence:
                        size: "8Gi"

                redis:
                    image:
                        repository: bitnamilegacy/redis
                    # auth stays disabled: this chart never injects REDIS_PASSWORD into
                    # the API/worker/cronjob pods, so enabling Redis auth would break
                    # them. Securing Redis requires a chart change first; until then the
                    # ansible openeo-redis secret is intentionally NOT wired here.
                    auth:
                        enabled: false
                    persistence:
                        size: "8Gi"
                    replicas:
                        enabled: true
                        count: 1

                service:
                    type: ClusterIP
                    port: 8000

                ingress:
                    enabled: false

                resources:
                    limits:
                        cpu: 500m
                        memory: 512Mi
                    requests:
                        cpu: 250m
                        memory: 256Mi

                autoscaling:
                    enabled: false

                nodeSelector: {}
                tolerations: []
                affinity: {}

    destination:
        name: in-cluster
        namespace: openeo

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
            - RespectIgnoreDifferences=true
