apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: openeo-argoworkflows
    namespace: argocd
spec:
    project: polaris
    # Multi-source: the chart comes from the charts repo, but ALL Helm values live
    # in this repo (polaris-apps) under values/, pulled in via the `$values` ref
    # below. That keeps the env config as plain, reviewable YAML and lets ArgoCD
    # Image Updater git-write-back image-tag bumps here (see values/image-*.yaml
    # and overlays/dev/kustomization.yaml).
    #
    # valueFiles merge in order (later wins): base.yaml -> <env>.yaml -> image-<env>.yaml.
    # Overlays repoint these to their per-env files. There is intentionally NO
    # inline valuesObject — it would outrank valueFiles and shadow the files.
    sources:
        - repoURL: https://github.com/Eurac-Research-Institute-for-EO/charts
          targetRevision: openeo-fix
          path: eodc/openeo-argo
          helm:
              releaseName: openeo
              valueFiles:
                  - $values/apps/openeo-argoworkflows/values/base.yaml
                  - $values/apps/openeo-argoworkflows/values/image-base.yaml

        # Values-only source: provides the files referenced as $values/... above.
        # No chart/path here — `ref: values` just makes this repo's tree available
        # to the Helm source. targetRevision tracks the branch app-of-apps syncs.
        - repoURL: https://github.com/Eurac-Research-Institute-for-EO/polaris-apps
          targetRevision: dev
          ref: values

    destination:
        name: in-cluster
        namespace: openeo

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
            - RespectIgnoreDifferences=true
