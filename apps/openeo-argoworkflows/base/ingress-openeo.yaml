apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: openeo-argoworkflows
    namespace: openeo
    labels:
        app: openeo-argoworkflows
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
    ingressClassName: traefik
    rules:
        # Host-less rule: matches any Host header, so the API is reachable
        # directly by node IP (http://<node-ip>/openeo/...). Per-environment
        # public hostnames are added in the overlays (stable adds openeo.eurac.edu).
        - http:
              paths:
                  # Versioned API (e.g. /openeo/1.1.0/...).
                  - path: /openeo
                    pathType: Prefix
                    backend:
                        service:
                            name: openeo-openeo-argo
                            port:
                                number: 8000
                  # openEO discovery document, served at the domain root by the
                  # API — required for openEO clients to bootstrap from the host.
                  - path: /.well-known/openeo
                    pathType: Prefix
                    backend:
                        service:
                            name: openeo-openeo-argo
                            port:
                                number: 8000
