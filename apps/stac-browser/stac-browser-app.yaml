# STAC Browser — static Vue SPA (nginx) for browsing the EURAC STAC catalog.
#
#  - Deployed from our fork's Helm chart (chart/ dir on the helm-chart branch of
#    Eurac-Research-Institute-for-EO/stac-browser), rendered by ArgoCD's native
#    Helm support with the inline values below.
#  - Image: ghcr.io/eurac-research-institute-for-eo/stac-browser:eurac -> pulls
#    via k3s node containerd creds. DO NOT add imagePullSecrets (same convention
#    as web-editor). The image reference is NOT inline below: it lives in
#    values/image.yaml so ArgoCD Image Updater can git-write-back tag bumps there
#    (see imageupdater.yaml).
#  - catalogUrl is a RUNTIME option (entrypoint writes runtime-config.js at
#    container start), so no image rebuild is needed to point at a new catalog.
#  - Served at the domain root (pathPrefix "/"), so the stock image works as-is.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: stac-browser
    namespace: argocd
    finalizers:
        - resources-finalizer.argocd.argoproj.io
spec:
    project: polaris
    # Multi-source: the chart comes from our stac-browser fork, but the image
    # reference lives in THIS repo (polaris-apps) under values/, pulled in via the
    # `$values` ref below, so Image Updater can commit tag bumps to it.
    #
    # Inline `values:` outranks `valueFiles` in Helm, so `image:` must NOT appear
    # inline here — it would shadow whatever Image Updater writes to image.yaml.
    # Everything else (runtime config, ingress) has no reason to move out.
    sources:
        - repoURL: https://github.com/Eurac-Research-Institute-for-EO/stac-browser
          targetRevision: manager
          path: chart
          helm:
            releaseName: stac-browser
            valueFiles:
                - $values/apps/stac-browser/values/image.yaml
            values: |
                # STAC Browser runtime config (SB_* env -> runtime-config.js).
                #
                # NOTE: `allowExternalAccess` does NOT give users a catalog
                # picker. As long as `catalogUrl` is set, the browser boots
                # directly into (and stays locked to) that single catalog;
                # allowExternalAccess only lets it follow links to STAC data that
                # is not a child of catalogUrl. To let users enter any catalog
                # URL / pick one from stacindex.org, `catalogUrl` must be null or
                # removed (a null override drops the key from the merged Helm
                # values, so no SB_catalogUrl env is emitted and the app falls
                # back to its built-in null default = landing screen).
                config:
                  # catalogUrl intentionally null: boots to the landing screen so
                  # any STAC catalog/API URL can be entered (e.g. the pgstac at
                  # http://stac.10.8.244.253.nip.io/). Set it back to a URL to lock
                  # the browser to a single catalog again.
                  catalogUrl: null
                  catalogTitle: "EURAC STAC Browser"
                  # Set to "false" to restrict browsing to catalogUrl only.
                  allowExternalAccess: "true"
                  # Management UI ("Manage" button next to Source/Share) via the
                  # STAC API Transactions extension. `transactions` is on by
                  # default; the button only appears once the STAC API at
                  # catalogUrl actually advertises transaction support AND (by
                  # default) the user is logged in. To trial it without those,
                  # flip the two flags below to "false" — but that lets anyone
                  # attempt writes, and it only works if the API allows it too,
                  # so keep them "true" against a real backend.
                  transactions: "true"
                  # transactionsRequireLogin: "false"
                  # transactionsRequirePreflight: "false"

                ingress:
                  enabled: true
                  className: traefik
                  annotations:
                    traefik.ingress.kubernetes.io/router.entrypoints: web
                  hosts:
                    - host: browser.10.8.244.253.nip.io
                      paths:
                        - path: /
                          pathType: Prefix

        # Values-only source: provides the file referenced as $values/... above.
        # No chart/path here — `ref: values` just makes this repo's tree available
        # to the Helm source. targetRevision tracks the branch app-of-apps syncs.
        - repoURL: https://github.com/Eurac-Research-Institute-for-EO/polaris-apps
          targetRevision: dev
          ref: values

    destination:
        server: https://kubernetes.default.svc
        namespace: stac-browser

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
            allowEmpty: false
        syncOptions:
            - Validate=true
            - CreateNamespace=true
            - PrunePropagationPolicy=foreground
            - PruneLast=true
