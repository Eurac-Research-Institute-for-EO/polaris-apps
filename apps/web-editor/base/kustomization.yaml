apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Env-neutral base for the openEO web editor.
# Namespace, image tag, and public host are applied per environment in
# overlays/stable and overlays/dev. Do not reference this base directly from
# apps/kustomization.yaml — reference the overlays instead.
resources:
    - deployment.yaml
    - service.yaml
    - ingress.yaml
