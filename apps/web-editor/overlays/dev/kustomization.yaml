apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev openEO web editor in namespace "web-editor-dev". Ingress is HOST-LESS
# (inherited from base), so it serves /editor on any Host — primarily
# https://dev.openeo.eurac.edu/editor (Andrea's HTTPS proxy -> .185 Traefik web),
# which is required for OIDC: the editor must be same-origin/HTTPS as the dev
# backend so the PKCE popup works in a secure context. The nip.io host
# (http://dev.editor.10.8.244.253.nip.io/editor) still works too (host-less),
# but is HTTP so login won't complete there. Mirrors openeo-argoworkflows/dev.
#
# The backend URL is baked into the image at build time; the :dev tag is built
# against https://dev.openeo.eurac.edu/ via OPENEO_SERVER_URL (editor CI, PR #2).
namespace: web-editor-dev

resources:
    - namespace.yaml
    - ../../base

images:
    - name: ghcr.io/eurac-research-institute-for-eo/openeo-web-editor
      newTag: dev
